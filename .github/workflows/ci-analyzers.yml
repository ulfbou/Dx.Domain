# path: .github/workflows/ci-analyzers.yml
name: CI (Analyzers & Docs Governance)

on:
  pull_request:
    branches: [ master, release/0.1.0-alpha ]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: List installed SDKs
        run: dotnet --list-sdks

      - name: Run shared WS-003 release gate
        run: |
          mkdir -p "$DX"
          python3 scripts/release-gate/run.py --profile ci
        env:
          DX: ${{ runner.temp }}/dx

      - name: Upload WS-003 release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws-003-release-gate-analyzers-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dx/verification/release-gate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Public API baseline check (Analyzers)
        run: dotnet build src/Dx.Domain.Analyzers/Dx.Domain.Analyzers.csproj -c Release --no-restore -p:GeneratePublicApi=true

      - name: Verify diagnostic metadata conformance
        run: python3 scripts/verify-diagnostic-conformance.py

      - name: Docs lint (broken links + metadata)
        if: hashFiles('scripts/docs-lint.sh') != ''
        run: scripts/docs-lint.sh

      - name: Snippet compile (public docs)
        if: hashFiles('scripts/docs-snippets-compile.sh') != ''
        run: scripts/docs-snippets-compile.sh docs/public net8.0

      - name: Block unapproved breaking changes
        if: hashFiles('scripts/api-diff-gate.sh') != ''
        run: scripts/api-diff-gate.sh
      - name: Upload mandatory release-gate carriers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-carrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dx/*.dx.txt
          if-no-files-found: error
          retention-days: 30
