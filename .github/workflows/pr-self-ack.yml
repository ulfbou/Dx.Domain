name: review-emulation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

jobs:
  emulate_second_eyes:
    name: second-eyes
    runs-on: ubuntu-latest
    steps:
      - name: Enforce minimum cool-down + explicit self-ack
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const opened = new Date(pr.created_at).getTime();
            const now = Date.now();
            const hoursOpen = (now - opened) / 3_600_000;
            const hasSelfAck = (pr.labels || []).some(l => l.name.toLowerCase() === 'self-ack');

            const reasons = [];
            if (hoursOpen < 4) reasons.push(`PR open for only ${hoursOpen.toFixed(2)}h (< 4h)`);            
            if (!hasSelfAck) reasons.push("Missing 'self-ack' label");

            if (reasons.length) {
              core.setFailed(`Second-eyes emulation: ${reasons.join(' & ')}`);
            } else {
              core.notice('Second-eyes emulation: passed.');
            }
