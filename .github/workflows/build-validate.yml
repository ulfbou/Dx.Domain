name: Build & Validate

on:
  pull_request:
    branches: [ master, release/0.1.0-alpha ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit lint
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.json
          commitDepth: 1
          failOnWarnings: false

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: List SDKs
        run: dotnet --list-sdks

      - name: Debug - list props and project refs
        run: |
          echo "=== Directory.Build.props ==="
          cat Directory.Build.props
          echo "=== Facts csproj refs ==="
          grep -n "Reference Include" src/Dx.Domain.Facts/Dx.Domain.Facts.csproj || true
          echo "=== MSBuild evaluated IsPackable ==="
          dotnet msbuild src/Dx.Domain.Facts/Dx.Domain.Facts.csproj -getProperty:IsPackable

      - name: Run shared WS-003 release gate
        run: |
          mkdir -p "$DX"
          python3 scripts/release-gate/run.py --profile ci
        env:
          DX: ${{ runner.temp }}/dx

      - name: Upload WS-003 release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws-003-release-gate-build-validate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dx/verification/release-gate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Run WS-004 candidate gate
        run: |
          mkdir -p "$DX"
          python3 scripts/release-gate/run.py --profile candidate
        env:
          DX: ${{ runner.temp }}/dx
      - name: Upload candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: |
            .dx/verification/release-gate/**/candidate-manifest.json
            .dx/verification/release-gate/**/packages/*.nupkg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Verify diagnostic metadata conformance
        run: python3 scripts/verify-diagnostic-conformance.py

      - name: Docs lint
        run: scripts/docs-lint.sh

      - name: Snippet structure validation
        run: scripts/docs-snippets-compile.sh docs/public net8.0

      - name: Compile material documentation examples
        run: bash scripts/docs-examples-compile.sh
      - name: Upload mandatory release-gate carriers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-carrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dx/*.dx.txt
          if-no-files-found: error
          retention-days: 30
