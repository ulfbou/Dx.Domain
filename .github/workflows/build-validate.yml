name: build-validate
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: List installed SDKs
        run: dotnet --list-sdks

      - name: Use maintainer analyzer profile
        if: hashFiles('.editorconfig.maintainers') != ''
        run: cp .editorconfig.maintainers .editorconfig

      - name: Restore
        run: dotnet restore

      # Build in Debug so legacy pack targets (Release-only) do NOT run
      - name: Build (Debug, no pack)
        run: dotnet build -c Debug --no-restore

      - name: Test (Debug)
        run: dotnet test -c Debug --no-build --verbosity normal

      # Optional: docs lint/snippet compile – wire up your actual scripts here
      - name: Docs lint (placeholder)
        run: echo "Docs lint here (link-check/snippet-compile)."

      - name: Verify per-package docs (README/CHANGELOG)
        run: |
          set -euo pipefail
          pkgs=("src/Dx.Domain.Kernel" "src/Dx.Domain.Primitives" "src/Dx.Domain.Facts" "src/Dx.Domain.Annotations")
          for p in "${pkgs[@]}"; do
            test -s "$p/README.md" || { echo "::error file=$p/README.md::Missing README.md"; exit 1; }
            test -s "$p/CHANGELOG.md" || { echo "::error file=$p/CHANGELOG.md::Missing CHANGELOG.md"; exit 1; }
            lines=$(( $(wc -l < "$p/README.md") + $(wc -l < "$p/CHANGELOG.md") ))
            if [ "$lines" -lt 20 ]; then
              echo "::error file=$p::README+CHANGELOG too small ($lines lines)"; exit 1;
            fi
          done
