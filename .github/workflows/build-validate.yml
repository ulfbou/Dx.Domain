name: Build & Validate

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: List SDKs
        run: dotnet --list-sdks

      #
      # Analyzer profile resolution
      #
      - name: Use maintainer analyzer profile (if present)
        if: ${{ hashFiles('.editorconfig.maintainers') != '' }}
        run: cp .editorconfig.maintainers .editorconfig

      - name: Use consumer analyzer profile (fallback)
        if: ${{ hashFiles('.editorconfig.maintainers') == '' && hashFiles('.editorconfig.consumers') != '' }}
        run: cp .editorconfig.consumers .editorconfig

      - name: Ensure .editorconfig exists (ultimate fallback)
        if: ${{ hashFiles('.editorconfig') == '' }}
        run: |
          echo "root = true" > .editorconfig
          echo "" >> .editorconfig
          echo "[*]" >> .editorconfig

      #
      # Build & test
      #
      - name: Restore
        run: dotnet restore

      - name: Build (Release, all TFMs)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      #
      # Docs lint placeholder
      #
      - name: Docs lint (placeholder)
        run: echo "Docs lint not yet implemented"
