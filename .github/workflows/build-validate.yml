name: Build & Validate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: List SDKs
        run: dotnet --list-sdks

      # Analyzer profile resolution (maintainer → consumer → fallback)
      - name: Use maintainer analyzer profile
        if: ${{ hashFiles('.editorconfig.maintainers') != '' }}
        run: cp .editorconfig.maintainers .editorconfig

      - name: Use consumer analyzer profile (fallback)
        if: ${{ hashFiles('.editorconfig.maintainers') == '' && hashFiles('.editorconfig.consumers') != '' }}
        run: cp .editorconfig.consumers .editorconfig

      - name: Ensure .editorconfig exists (final fallback)
        if: ${{ hashFiles('.editorconfig') == '' }}
        run: |
          echo "root = true" > .editorconfig
          echo "" >> .editorconfig
          echo "[*]" >> .editorconfig

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        # Governance decides DX*, not CLI
        run: dotnet build -c Release --no-restore -p:TreatWarningsAsErrors=false

      - name: Run tests
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Docs lint (placeholder)
        run: echo "Docs lint not yet implemented"
