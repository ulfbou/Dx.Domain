# Builds and publishes the canonical documentation tree.
name: Build & Publish DocFX Documentation

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'docs/docfx.json'
      - 'docs/toc.yml'
      - 'dotnet-tools.json'
      - '.github/workflows/docfx.yml'

permissions:
  contents: write

concurrency:
  group: docfx-pages
  cancel-in-progress: true

jobs:
  build-docfx:
    name: Build DocFX Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: List installed SDKs
        run: dotnet --list-sdks

      - name: Restore pinned tools
        run: dotnet tool restore

      - name: Build canonical documentation
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Upload generated docs site
        uses: actions/upload-artifact@v4
        with:
          name: docfx-site
          path: _site
          if-no-files-found: error

      - name: Deploy docs site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
