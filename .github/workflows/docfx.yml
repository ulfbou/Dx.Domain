name: Build & Publish DocFX Documentation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'docfx.json'
      - 'assets/**'
      - '.github/workflows/docfx.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'docfx.json'
      - 'assets/**'
      - '.github/workflows/docfx.yml'
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build-docfx:
    name: Build DocFX Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs (8.x, 9.x, 10.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Dotnet --info (diagnostic)
        run: dotnet --info

      - name: Install DocFX (pinned version)
        run: dotnet tool install -g docfx --version 2.77.0

      - name: Add .dotnet/tools to PATH
        run: echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: Build documentation
        run: docfx docfx.json --output _site

      - name: Upload generated site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docfx-site
          path: _site

      # Publish only outside pull_request events
      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
